services:
  postgres:
    ports: []
  redis:
    ports: []
  minio:
    ports: []
  api:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/tls:/etc/nginx/tls:ro
      - certbot_web:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://127.0.0.1/api/v1/health"]

volumes:
  certbot_web:
